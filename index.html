<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冒險者傳說：猜拳大對決 ✊✋✌️</title>
  <!-- Google Fonts 質感字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* CSS 樣式表：暗黑奇幻電玩風格 */
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.75);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-glow: rgba(139, 92, 246, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.2);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .img-16-9 {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .screen {
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title-main {
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent-cyan);
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .equip-card {
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .equip-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-purple);
      box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
    }

    .equip-card.selected {
      border-color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.1);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }

    .equip-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 10px 0 4px 0;
      color: var(--accent-amber);
    }

    .equip-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 30px rgba(236, 72, 153, 0.6);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
    }

    .score-board {
      text-align: center;
    }

    .round-badge {
      font-size: 0.85rem;
      background: var(--accent-amber);
      color: #000;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .score-text {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .progress-bar-container {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .p-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .p-dot.filled-player {
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .p-dot.filled-boss {
      background: var(--accent-pink);
      box-shadow: 0 0 10px var(--accent-pink);
    }

    .arena-display {
      position: relative;
      margin-bottom: 20px;
      border-radius: 16px;
      overflow: hidden;
    }

    .arena-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.3));
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
    }

    .fighter-box {
      text-align: center;
    }

    .gesture-emoji {
      font-size: 4rem;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .fighter-box.shake {
      animation: shakeAnim 0.5s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-5deg); }
      40% { transform: translateX(10px) rotate(5deg); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }

    .action-title {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .btn-action {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px 8px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.15);
      transform: translateY(-4px);
    }

    .btn-action span.icon {
      font-size: 2.2rem;
    }

    .battle-log {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      padding: 12px 16px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-item {
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .log-win { color: #4ade80; }
    .log-lose { color: #f87171; }
    .log-tie { color: #fbbf24; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .modal-card {
      background: var(--bg-card);
      border: 2px solid var(--accent-amber);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      text-align: center;
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.4);
    }

    .modal-icon {
      font-size: 4rem;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-desc {
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    
    <div id="screen-login" class="screen active">
      <h1 class="title-main">⚔️ 冒險者傳說：猜拳大對決</h1>
      <p class="subtitle">先獲得 4 勝的一方就是最終贏家！準備好了嗎？</p>

      <div style="margin-bottom: 20px;">
        <img class="img-16-9" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%230f172a'/><stop offset='50%' stop-color='%231e1b4b'/><stop offset='100%' stop-color='%23311042'/></linearGradient><linearGradient id='glow' x1='0%' y1='0%' x2='100%' y2='0%'><stop offset='0%' stop-color='%2306b6d4'/><stop offset='100%' stop-color='%23ec4899'/></linearGradient></defs><rect width='800' height='450' fill='url(%23bg)'/><circle cx='400' cy='225' r='180' fill='none' stroke='url(%23glow)' stroke-width='3' stroke-dasharray='10 15' opacity='0.4'/><circle cx='400' cy='225' r='120' fill='none' stroke='%238b5cf6' stroke-width='2' opacity='0.6'/><text x='400' y='210' font-family='Arial' font-size='72' text-anchor='middle' fill='%23f8fafc'>✊ ✋ ✌️</text><text x='400' y='270' font-family='sans-serif' font-size='24' font-weight='bold' text-anchor='middle' fill='%2306b6d4'>- ROCK PAPER SCISSORS QUEST -</text></svg>" alt="冒險大對決主圖">
      </div>

      <div class="input-group">
        <label for="player-name-input">👤 請輸入你的冒險者名字：</label>
        <input type="text" id="player-name-input" placeholder="例如：勇者小明" value="勇者小明">
      </div>

      <label style="display:block; font-weight:700; color:var(--accent-cyan); margin-bottom:12px;">🗡️ 請選擇你的使用裝備（三選一）：</label>
      <div class="equipment-grid">
        
        <div class="equip-card selected" onclick="selectEquipment('黃金鍵盤', this)">
          <img class="img-16-9" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'><rect width='800' height='450' fill='%23090d16'/><rect x='150' y='120' width='500' height='210' rx='16' fill='%231e293b' stroke='%23f59e0b' stroke-width='5'/><rect x='180' y='150' width='440' height='30' fill='%23f59e0b' opacity='0.8'/><rect x='180' y='195' width='440' height='30' fill='%23fbbf24' opacity='0.8'/><rect x='220' y='240' width='360' height='30' fill='%23f59e0b' opacity='0.8'/></svg>" alt="黃金鍵盤">
          <div class="equip-name">⌨️ 1. 黃金鍵盤</div>
          <div class="equip-desc">閃耀金色光芒的機械鍵盤，能敲出無可匹敵的指令攻擊！</div>
        </div>

        <div class="equip-card" onclick="selectEquipment('魔法魔杖', this)">
          <img class="img-16-9" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'><rect width='800' height='450' fill='%231e1b4b'/><circle cx='400' cy='225' r='90' fill='%238b5cf6' opacity='0.3'/><path d='M250 350 L550 100' stroke='%2306b6d4' stroke-width='16' stroke-linecap='round'/><circle cx='550' cy='100' r='25' fill='%23f59e0b'/></svg>" alt="魔法魔杖">
          <div class="equip-name">🪄 2. 魔法魔杖</div>
          <div class="equip-desc">蘊含古老元素的法杖，讓你能預知對手的出拳心理！</div>
        </div>

        <div class="equip-card" onclick="selectEquipment('英雄之劍', this)">
          <img class="img-16-9" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'><rect width='800' height='450' fill='%230f172a'/><path d='M400 80 L420 300 L400 340 L380 300 Z' fill='%23e2e8f0'/><rect x='340' y='300' width='120' height='20' rx='10' fill='%23ec4899'/><rect x='390' y='320' width='20' height='60' fill='%2378350f'/></svg>" alt="英雄之劍">
          <div class="equip-name">⚔️ 3. 英雄之劍</div>
          <div class="equip-desc">斬斷一切邪惡的傳說聖劍，隨手一揮便充滿王者氣場！</div>
        </div>

      </div>

      <button class="btn-primary" onclick="startGame()">🚀 進入猜拳戰鬥大對決</button>
    </div>

    <div id="screen-game" class="screen">
      
      <div class="battle-header">
        <div class="player-info">
          <div class="avatar-icon">🧙‍♂️</div>
          <div>
            <div id="display-player-name" style="font-weight:700; font-size:1.1rem;">冒險者</div>
            <div id="display-equipment" style="font-size:0.8rem; color:var(--accent-amber);">裝備：無</div>
            <div class="progress-bar-container" id="player-dots">
            </div>
          </div>
        </div>

        <div class="score-board">
          <div class="round-badge" id="round-title">第 1 回合</div>
          <div class="score-text"><span id="score-player" style="color:var(--accent-cyan);">0</span> : <span id="score-boss" style="color:var(--accent-pink);">0</span></div>
          <div style="font-size:0.75rem; color:var(--text-muted);">先拿 4 勝獲勝</div>
        </div>

        <div class="player-info" style="flex-direction:row-reverse; text-align:right;">
          <div class="avatar-icon" style="background:linear-gradient(135deg, var(--accent-pink), var(--accent-amber));">🤖</div>
          <div>
            <div style="font-weight:700; font-size:1.1rem;">電腦對手</div>
            <div style="font-size:0.8rem; color:var(--accent-pink);">AI 核心</div>
            <div class="progress-bar-container" id="boss-dots" style="justify-content:flex-end;">
            </div>
          </div>
        </div>
      </div>

      <div class="arena-display">
        <img class="img-16-9" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'><defs><linearGradient id='bgbattle' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' stop-color='%231e1b4b'/><stop offset='100%' stop-color='%230f172a'/></linearGradient></defs><rect width='800' height='450' fill='url(%23bgbattle)'/><path d='M0 450 L350 250 L450 250 L800 450 Z' fill='%231e293b' opacity='0.8'/><line x1='400' y1='250' x2='400' y2='450' stroke='%238b5cf6' stroke-width='2' stroke-dasharray='8 8'/></svg>" alt="戰鬥舞台">
        <div class="arena-overlay">
          <div class="fighter-box" id="box-player">
            <div style="font-size:0.9rem; color:var(--accent-cyan); font-weight:700; margin-bottom:8px;">你出了</div>
            <div class="gesture-emoji" id="gesture-player">❓</div>
          </div>

          <div style="font-size:2rem; font-weight:900; color:var(--accent-amber);">VS</div>

          <div class="fighter-box" id="box-boss">
            <div style="font-size:0.9rem; color:var(--accent-pink); font-weight:700; margin-bottom:8px;">電腦出了</div>
            <div class="gesture-emoji" id="gesture-boss">❓</div>
          </div>
        </div>
      </div>

      <div class="action-title">⚔️ 請出拳 (選擇 剪刀、石頭 或 布)：</div>
      <div class="action-grid">
        <button class="btn-action" onclick="playRound('剪刀')">
          <span class="icon">✌️</span>
          <span>剪刀</span>
        </button>
        <button class="btn-action" onclick="playRound('石頭')">
          <span class="icon">✊</span>
          <span>石頭</span>
        </button>
        <button class="btn-action" onclick="playRound('布')">
          <span class="icon">✋</span>
          <span>布</span>
        </button>
      </div>

      <div class="battle-log" id="battle-log">
        <div class="log-item">📜 戰鬥開始！請冒險者選擇出拳...</div>
      </div>

    </div>

  </div>

  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🏆</div>
      <div class="modal-title" id="modal-title">最終結果</div>
      <div class="modal-desc" id="modal-desc">遊戲結束！</div>
      <button class="btn-primary" onclick="resetGame()">🔄 重新開始遊戲</button>
    </div>
  </div>

  <script>
    let playerName = "勇者小明";
    let selectedEquip = "黃金鍵盤";
    let playerWins = 0;
    let computerWins = 0;
    let roundNum = 1;
    const TARGET_WINS = 4;

    const options = ["剪刀", "石頭", "布"];
    const emojiMap = { "剪刀": "✌️", "石頭": "✊", "布": "✋" };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(783, now + 0.16);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'tie') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'victory') {
        const notes = [523, 659, 783, 1046];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.connect(g);
          g.connect(audioCtx.destination);
          const t = now + idx * 0.12;
          o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          o.start(t);
          o.stop(t + 0.3);
        });
      }
    }

    function selectEquipment(equipName, cardElement) {
      playSound('click');
      selectedEquip = equipName;
      document.querySelectorAll('.equip-card').forEach(card => card.classList.remove('selected'));
      cardElement.classList.add('selected');
    }

    function startGame() {
      playSound('click');
      const inputVal = document.getElementById('player-name-input').value.trim();
      if (inputVal !== "") {
        playerName = inputVal;
      }

      document.getElementById('display-player-name').innerText = playerName;
      document.getElementById('display-equipment').innerText = `裝備：${selectedEquip}`;

      renderProgressDots();

      document.getElementById('screen-login').classList.remove('active');
      document.getElementById('screen-game').classList.add('active');

      addLog(`=== 系統廣播 ===
歡迎勇敢的冒險者【${playerName}】！你已經裝備了【${selectedEquip}】，準備好迎接第一關的【猜拳】挑戰！`, 'log-tie');
    }

    function renderProgressDots() {
      const pContainer = document.getElementById('player-dots');
      const bContainer = document.getElementById('boss-dots');
      pContainer.innerHTML = '';
      bContainer.innerHTML = '';

      for (let i = 0; i < TARGET_WINS; i++) {
        const pDot = document.createElement('div');
        pDot.className = 'p-dot' + (i < playerWins ? ' filled-player' : '');
        pContainer.appendChild(pDot);

        const bDot = document.createElement('div');
        bDot.className = 'p-dot' + (i < computerWins ? ' filled-boss' : '');
        bContainer.appendChild(bDot);
      }
    }

    function playRound(playerChoice) {
      if (playerWins >= TARGET_WINS || computerWins >= TARGET_WINS) return;

      const computerChoice = options[Math.floor(Math.random() * options.length)];

      document.getElementById('gesture-player').innerText = emojiMap[playerChoice];
      document.getElementById('gesture-boss').innerText = emojiMap[computerChoice];

      const boxPlayer = document.getElementById('box-player');
      const boxBoss = document.getElementById('box-boss');
      boxPlayer.classList.remove('shake');
      boxBoss.classList.remove('shake');
      void boxPlayer.offsetWidth;
      boxPlayer.classList.add('shake');
      boxBoss.classList.add('shake');

      let resultText = "";
      let resultClass = "";

      if (playerChoice === computerChoice) {
        playSound('tie');
        resultText = `--- 第 ${roundNum} 回合 ---
平手！沒有人得分。`;
        resultClass = "log-tie";
      } else if (
        (playerChoice === "剪刀" && computerChoice === "布") ||
        (playerChoice === "石頭" && computerChoice === "剪刀") ||
        (playerChoice === "布" && computerChoice === "石頭")
      ) {
        playSound('win');
        playerWins = playerWins + 1;
        resultText = `--- 第 ${roundNum} 回合 ---
🎉 這回合你贏了！【${playerChoice}】勝【${computerChoice}】。`;
        resultClass = "log-win";
      } else {
        playSound('lose');
        computerWins = computerWins + 1;
        resultText = `--- 第 ${roundNum} 回合 ---
💥 這回合電腦贏了！【${computerChoice}】勝【${playerChoice}】。`;
        resultClass = "log-lose";
      }

      roundNum = roundNum + 1;

      document.getElementById('score-player').innerText = playerWins;
      document.getElementById('score-boss').innerText = computerWins;
      document.getElementById('round-title').innerText = `第 ${roundNum} 回合`;
      renderProgressDots();

      addLog(resultText, resultClass);

      if (playerWins === TARGET_WINS || computerWins === TARGET_WINS) {
        setTimeout(showFinalResult, 600);
      }
    }

    function addLog(msg, className) {
      const logBox = document.getElementById('battle-log');
      const item = document.createElement('div');
      item.className = `log-item ${className}`;
      item.innerText = msg;
      logBox.prepend(item);
    }

    function showFinalResult() {
      const modal = document.getElementById('result-modal');
      const icon = document.getElementById('modal-icon');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');

      if (playerWins === TARGET_WINS) {
        playSound('victory');
        startConfetti();
        icon.innerText = "🏆";
        title.innerText = "=== 🌟 最終結果 🌟 ===";
        title.style.color = "var(--accent-amber)";
        desc.innerText = `🏆 恭喜你以 ${playerWins} : ${computerWins} 擊敗了電腦，成為剪刀石頭布大師！`;
      } else {
        icon.innerText = "💻";
        title.innerText = "=== 🌟 最終結果 🌟 ===";
        title.style.color = "var(--accent-pink)";
        desc.innerText = `💻 很可惜，電腦以 ${computerWins} : ${playerWins} 獲得了最終勝利，下次再來挑戰吧！`;
      }

      modal.classList.add('active');
    }

    function resetGame() {
      playSound('click');
      stopConfetti();

      playerWins = 0;
      computerWins = 0;
      roundNum = 1;

      document.getElementById('score-player').innerText = '0';
      document.getElementById('score-boss').innerText = '0';
      document.getElementById('round-title').innerText = '第 1 回合';
      document.getElementById('gesture-player').innerText = '❓';
      document.getElementById('gesture-boss').innerText = '❓';
      document.getElementById('battle-log').innerHTML = '<div class="log-item">📜 遊戲重置！請冒險者再次選擇出拳...</div>';

      renderProgressDots();

      document.getElementById('result-modal').classList.remove('active');
      document.getElementById('screen-game').classList.remove('active');
      document.getElementById('screen-login').classList.add('active');
    }

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiArray = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startConfetti() {
      confettiArray = [];
      for (let i = 0; i < 120; i++) {
        confettiArray.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: ['#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899', '#10b981'][Math.floor(Math.random() * 5)],
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1,
          angle: Math.random() * 360
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiArray.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.angle += 2;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.angle * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        if (p.y > canvas.height) p.y = -10;
      });
      animationFrameId = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>
</body>
</html>
